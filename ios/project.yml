# Generates HomeBase.xcodeproj. On your Mac: brew install xcodegen && xcodegen
name: HomeBase
options:
  bundleIdPrefix: com.davidrevoredo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  HomeBase:
    type: application
    platform: iOS
    sources: [HomeBase]
    info:
      path: HomeBase/Info.plist
      properties:
        CFBundleDisplayName: Home Base
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: Home Base reads your sleep, heart, activity, body, nutrition and workouts from Apple Health to show your readiness and progress.
        NSHealthUpdateUsageDescription: Home Base saves the things you log, like water, weight, caffeine and mindful minutes, to Apple Health.
    entitlements:
      path: HomeBase/HomeBase.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidrevoredo.homebase
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Home Base
